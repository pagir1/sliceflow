<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SliceFlow - Log in</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-orange-50 min-h-screen flex items-center justify-center p-6">
  <form id="login" method="post" action="/login" class="bg-white rounded-3xl shadow p-8 w-full max-w-md">
    <h1 class="text-3xl font-bold text-orange-600 text-center mb-6">SliceFlow</h1>

    <div class="font-semibold mb-2">1. Who are you?</div>
    <div class="grid grid-cols-3 gap-2 mb-6">
      {% for person in staff %}
        <label class="cursor-pointer">
          <input type="radio" name="user_id" value="{{ person.id }}" class="sr-only peer"
                 {% if chosen == person.id %}checked{% endif %}>
          <div class="rounded-xl border-2 border-gray-200 text-center py-3
                      peer-checked:border-orange-600 peer-checked:bg-orange-50">
            <div class="font-semibold">{{ person.name }}</div>
            <div class="text-xs text-gray-500">{{ person.role | lower }}</div>
          </div>
        </label>
      {% endfor %}
    </div>

    <div class="font-semibold mb-2">2. Enter your 4-digit PIN</div>
    <input id="pin" name="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off"
           class="w-full text-center text-4xl tracking-[0.5em] rounded-xl border border-gray-300 py-3 mb-3">

    {% if error %}
      <div class="mb-3 rounded-xl bg-red-50 text-red-800 px-4 py-3 text-center">{{ error }}</div>
    {% endif %}

    <div class="grid grid-cols-3 gap-2">
      {% for key in ["1","2","3","4","5","6","7","8","9","Clear","0","Back"] %}
        <button type="button" onclick="press('{{ key }}')"
                class="h-16 rounded-xl text-2xl font-semibold active:scale-95
                       {% if key in ['Clear', 'Back'] %}bg-gray-100 text-base{% else %}bg-orange-100 text-orange-900{% endif %}">
          {{ key }}
        </button>
      {% endfor %}
    </div>
  </form>

  <script>
    const pin = document.getElementById("pin");
    const form = document.getElementById("login");

    function press(key) {
      if (key === "Clear") pin.value = "";
      else if (key === "Back") pin.value = pin.value.slice(0, -1);
      else if (pin.value.length < 4) pin.value += key;
      submitWhenReady();
    }

    function submitWhenReady() {
      const someoneChosen = form.querySelector('input[name="user_id"]:checked');
      if (pin.value.length === 4 && someoneChosen) form.submit();
    }

    pin.addEventListener("input", submitWhenReady);
  </script>
</body>
</html>
