<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SliceFlow - Not allowed</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-orange-50 min-h-screen flex items-center justify-center p-6">
  <div class="bg-white rounded-2xl shadow p-8 max-w-md text-center">
    <h1 class="text-2xl font-bold mb-2">This screen is not for your role</h1>
    <p class="text-gray-600 mb-6">
      You are logged in as {{ user.name }} ({{ user.role | lower }}).
    </p>
    <div class="flex gap-3 justify-center">
      <a href="{{ home }}" class="px-5 py-3 rounded-xl bg-orange-600 text-white font-semibold">Go to my screen</a>
      <form method="post" action="/logout">
        <button class="px-5 py-3 rounded-xl border border-gray-300">Log out</button>
      </form>
    </div>
  </div>
</body>
</html>
