<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SliceFlow - Cashier</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body class="bg-orange-50 min-h-screen">

  <header class="bg-white shadow px-6 py-4 flex items-center justify-between">
    <h1 class="text-3xl font-bold text-orange-600">SliceFlow</h1>
    <span class="text-gray-500">Cashier</span>
  </header>

  <main class="grid grid-cols-3 gap-6 p-6">

    <!-- LEFT: menu buttons (2 of 3 columns) -->
    <section class="col-span-2 space-y-6">

      <div class="bg-white rounded-2xl shadow p-6">
        <h2 class="text-2xl font-semibold mb-2">Pizza</h2>
        <p class="text-gray-500">Visual pizza builder comes on Day 6.</p>
      </div>

      <div class="bg-white rounded-2xl shadow p-6">
        <h2 class="text-2xl font-semibold mb-4">Sides</h2>
        <div class="grid grid-cols-2 gap-3">
          {% for item in sides %}
            <button hx-post="/cart/add/{{ item.id }}" hx-target="#ticket" hx-swap="outerHTML"
                    class="min-h-16 bg-orange-100 hover:bg-orange-200 active:scale-95 rounded-xl px-4 py-3 text-left">
              <div class="text-lg font-semibold text-orange-900">{{ item.name }}</div>
              <div class="text-orange-700">{{ item.price_cents | money }}</div>
            </button>
          {% endfor %}
        </div>
      </div>

      <div class="bg-white rounded-2xl shadow p-6">
        <h2 class="text-2xl font-semibold mb-4">Drinks</h2>
        <div class="grid grid-cols-2 gap-3">
          {% for item in drinks %}
            <button hx-post="/cart/add/{{ item.id }}" hx-target="#ticket" hx-swap="outerHTML"
                    class="min-h-16 bg-sky-100 hover:bg-sky-200 active:scale-95 rounded-xl px-4 py-3 text-left">
              <div class="text-lg font-semibold text-sky-900">{{ item.name }}</div>
              <div class="text-sky-700">{{ item.price_cents | money }}</div>
            </button>
          {% endfor %}
        </div>
      </div>

    </section>

    <!-- RIGHT: the order ticket (1 of 3 columns) -->
    <aside>
      {% include "partials/ticket.html" %}
    </aside>

  </main>
</body>
</html>
