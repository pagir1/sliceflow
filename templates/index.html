<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SliceFlow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body class="bg-orange-50 min-h-screen flex items-center justify-center">
  <div class="bg-white rounded-2xl shadow-lg p-10 text-center">
    <h1 class="text-4xl font-bold text-orange-600 mb-6">SliceFlow</h1>
    <p id="count" class="text-xl mb-6">Pizzas ordered: {{ count }}</p>
    <button hx-post="/order" hx-target="#count"
            class="bg-orange-600 text-white text-xl px-8 py-4 rounded-xl active:scale-95">
      Order a pizza
    </button>
  </div>
</body>
</html>
