<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SliceFlow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body class="bg-orange-50 min-h-screen p-8">
  <div class="max-w-3xl mx-auto">

    <div class="bg-white rounded-2xl shadow p-8 text-center mb-6">
      <h1 class="text-4xl font-bold text-orange-600 mb-4">SliceFlow</h1>
      <p id="count" class="text-xl mb-6">Orders in database: {{ count }}</p>
      <button hx-post="/order" hx-target="#count"
              class="bg-orange-600 text-white text-xl px-8 py-4 rounded-xl active:scale-95">
        Order a pizza
      </button>
    </div>

    <div class="bg-white rounded-2xl shadow p-6 mb-6">
      <h2 class="text-2xl font-semibold mb-4">Toppings</h2>
      <div class="flex flex-wrap gap-2">
        {% for t in toppings %}
          <span class="bg-orange-100 text-orange-800 px-3 py-2 rounded-full">{{ t.name }}</span>
        {% endfor %}
      </div>
    </div>

    <div class="grid grid-cols-2 gap-6">
      <div class="bg-white rounded-2xl shadow p-6">
        <h2 class="text-2xl font-semibold mb-4">Sides</h2>
        {% for item in sides %}
          <div class="flex justify-between py-2 border-b">
            <span>{{ item.name }}</span>
            <span class="font-semibold">{{ item.price_cents | money }}</span>
          </div>
        {% endfor %}
      </div>
      <div class="bg-white rounded-2xl shadow p-6">
        <h2 class="text-2xl font-semibold mb-4">Drinks</h2>
        {% for item in drinks %}
          <div class="flex justify-between py-2 border-b">
            <span>{{ item.name }}</span>
            <span class="font-semibold">{{ item.price_cents | money }}</span>
          </div>
        {% endfor %}
      </div>
    </div>

  </div>
</body>
</html>
